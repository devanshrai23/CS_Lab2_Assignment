<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBazaar - Login</title>
    <style>
        /* Embedding styles here since it is on a different port and doesn't share /public */
        body { font-family: sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        header { background-color: #222; color: #fff; width: 100%; padding: 1rem 0; text-align: center; }
        main { background-color: #fff; padding: 2rem; margin-top: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 0.5rem; }
        .form-group input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .button { display: inline-block; padding: 0.5rem 1rem; background-color: #007bff; color: #fff; text-decoration: none; border: none; border-radius: 4px; cursor: pointer; }
        .button:hover { background-color: #0056b3; }
        .banner { background-color: red; color: white; padding: 1rem; font-weight: bold; width: 100%; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="banner">
        ATTACKER SERVER — CREDENTIALS STOLEN
    </div>
    <header>
        <h1>TechBazaar</h1>
    </header>
    <main>
        <h2>Login to your account</h2>
        <form action="/" method="POST" id="phishing-form">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="button">Log In</button>
        </form>
    </main>
    <script>
        document.getElementById('phishing-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Credentials captured!');
        });
    </script>
</body>
</html>
